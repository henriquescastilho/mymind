<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DME LIFE OS — Henrique</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080808;
  --surface: #0f0f0f;
  --card: #141414;
  --border: #1e1e1e;
  --border2: #2a2a2a;
  --gold: #c8a84b;
  --gold2: #e8c96a;
  --gold-bg: rgba(200,168,75,0.08);
  --gold-border: rgba(200,168,75,0.25);
  --red: #e84040;
  --red-bg: rgba(232,64,64,0.08);
  --green: #3ecf74;
  --green-bg: rgba(62,207,116,0.08);
  --blue: #4a8fe8;
  --blue-bg: rgba(74,143,232,0.08);
  --purple: #9b5de5;
  --purple-bg: rgba(155,93,229,0.08);
  --orange: #e87a3e;
  --orange-bg: rgba(232,122,62,0.08);
  --text: #d4d4d4;
  --text2: #888;
  --text3: #555;
  --mono: 'IBM Plex Mono', monospace;
  --display: 'Bebas Neue', sans-serif;
  --body: 'DM Sans', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;overflow-x:hidden}
.hdr{position:sticky;top:0;z-index:200;background:rgba(8,8,8,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:0;padding:0 28px;height:52px}
.hdr-logo{font-family:var(--display);font-size:20px;letter-spacing:3px;color:var(--gold);line-height:1}
.hdr-date{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:2px;text-align:center;text-transform:uppercase}
.hdr-right{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:1px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.nav{border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none;padding:0 28px;background:var(--bg)}
.nav::-webkit-scrollbar{display:none}
.ntab{font-family:var(--mono);font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3);padding:14px 16px;border:none;border-bottom:2px solid transparent;background:none;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
.ntab:hover{color:var(--text2)}
.ntab.on{color:var(--gold);border-bottom-color:var(--gold)}
.wrap{max-width:1100px;margin:0 auto;padding:24px 28px}
.page{display:none;animation:fadein .2s ease}
.page.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}.wrap{padding:16px}.nav,.hdr{padding:0 16px}}
.card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:18px}
.card+.card{margin-top:14px}
.clabel{font-family:var(--mono);font-size:8px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:15px;display:flex;align-items:center;gap:8px}
.clabel::before{content:'';width:2px;height:12px;background:var(--gold);border-radius:1px;flex-shrink:0}
.ptitle{font-family:var(--display);font-size:32px;letter-spacing:2px;color:var(--text);margin-bottom:4px}
.psub{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-bottom:22px}
.sep{font-family:var(--mono);font-size:8px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;display:flex;align-items:center;gap:12px;margin:22px 0 12px}
.sep::after{content:'';flex:1;height:1px;background:var(--border)}
.al{padding:10px 13px;border-radius:5px;border-left:2px solid;font-family:var(--mono);font-size:10px;line-height:1.7;margin-bottom:14px}
.al-g{background:var(--gold-bg);border-color:var(--gold);color:var(--gold)}
.al-r{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.al-gr{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.al-b{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.al-p{background:var(--purple-bg);border-color:var(--purple);color:var(--purple)}
.ci{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;border-radius:3px}
.ci:last-child{border-bottom:none}
.ci:hover{background:rgba(200,168,75,.03);padding:8px 10px;margin:0 -10px}
.cbox{width:15px;height:15px;flex-shrink:0;margin-top:2px;border:1.5px solid var(--text3);border-radius:2px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.ci.done .cbox{background:var(--gold);border-color:var(--gold)}
.ci.done .cbox::after{content:'';width:7px;height:4px;border-left:2px solid #080808;border-bottom:2px solid #080808;transform:rotate(-45deg) translateY(-1px);display:block}
.ci.done .ctext{text-decoration:line-through;color:var(--text3)}
.ci.skip .cbox{background:var(--border2);border-color:var(--text3)}
.ci.skip .cbox::after{content:'\2014';color:var(--text3);font-size:9px;line-height:1}
.ci.skip .ctext{opacity:.4}
.ctext{font-size:12px;flex:1;line-height:1.5}
.csub{font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:2px;line-height:1.5}
.tag{font-family:var(--mono);font-size:7px;letter-spacing:1px;text-transform:uppercase;padding:2px 6px;border-radius:2px;border:1px solid;flex-shrink:0;margin-top:2px}
.tg{color:var(--gold);border-color:var(--gold-border);background:var(--gold-bg)}
.tr{color:var(--red);border-color:rgba(232,64,64,.3);background:var(--red-bg)}
.tgr{color:var(--green);border-color:rgba(62,207,116,.3);background:var(--green-bg)}
.tb{color:var(--blue);border-color:rgba(74,143,232,.3);background:var(--blue-bg)}
.tp{color:var(--purple);border-color:rgba(155,93,229,.3);background:var(--purple-bg)}
.to{color:var(--orange);border-color:rgba(232,122,62,.3);background:var(--orange-bg)}
.badge{font-family:var(--mono);font-size:8px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid;display:inline-flex;align-items:center}
.bg{color:var(--gold);border-color:var(--gold-border);background:var(--gold-bg)}
.bgr{color:var(--green);border-color:rgba(62,207,116,.3);background:var(--green-bg)}
.br{color:var(--red);border-color:rgba(232,64,64,.3);background:var(--red-bg)}
.bb{color:var(--blue);border-color:rgba(74,143,232,.3);background:var(--blue-bg)}
.bp{color:var(--purple);border-color:rgba(155,93,229,.3);background:var(--purple-bg)}
.sr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.sr:last-child{border-bottom:none}
.srl{font-size:11px;color:var(--text2)}
.srr{font-family:var(--mono);font-size:11px;color:var(--text)}
.rw{display:flex;flex-direction:column;align-items:center;padding:10px}
.rsvg{transform:rotate(-90deg)}
.rbg{fill:none;stroke:var(--border2);stroke-width:5}
.rf{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.rl{text-anchor:middle;dominant-baseline:middle;font-family:var(--mono);font-size:12px;fill:var(--text);font-weight:700}
.rs{text-anchor:middle;dominant-baseline:middle;font-family:var(--mono);font-size:6px;fill:var(--text3);letter-spacing:2px}
.scrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.scrow:last-child{border-bottom:none}
.scname{font-size:11px;color:var(--text2);width:120px;flex-shrink:0}
.scdots{display:flex;gap:3px}
.sdot{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--border2);background:transparent;cursor:pointer;font-family:var(--mono);font-size:7px;color:var(--text3);display:flex;align-items:center;justify-content:center;transition:all .1s}
.sdot.on{background:var(--gold);border-color:var(--gold);color:#080808;font-weight:700}
.mbar{margin:10px 0}
.mbarl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--text3);margin-bottom:5px}
.mtrack{height:3px;background:var(--border2);border-radius:2px;overflow:hidden}
.mfill{height:100%;border-radius:2px;transition:width .5s ease}
.tlrow{display:grid;grid-template-columns:48px 1fr;gap:8px;margin-bottom:2px}
.tltime{font-family:var(--mono);font-size:8px;color:var(--text3);padding-top:9px;text-align:right;letter-spacing:1px}
.tlbody{border-left:2px solid var(--border2);padding:7px 12px;position:relative;border-radius:0 4px 4px 0;transition:background .1s}
.tlbody::before{content:'';position:absolute;left:-5px;top:11px;width:7px;height:7px;border-radius:50%;background:var(--border2)}
.tlrow.cg .tlbody{border-left-color:var(--gold);background:var(--gold-bg)}
.tlrow.cg .tlbody::before{background:var(--gold)}
.tlrow.cb .tlbody{border-left-color:var(--blue);background:var(--blue-bg)}
.tlrow.cb .tlbody::before{background:var(--blue)}
.tlrow.cgr .tlbody{border-left-color:var(--green);background:var(--green-bg)}
.tlrow.cgr .tlbody::before{background:var(--green)}
.tlrow.cp .tlbody{border-left-color:var(--purple);background:var(--purple-bg)}
.tlrow.cp .tlbody::before{background:var(--purple)}
.tlrow.cr .tlbody{border-left-color:var(--red);background:var(--red-bg)}
.tlrow.cr .tlbody::before{background:var(--red)}
.tlrow.co .tlbody{border-left-color:var(--orange);background:var(--orange-bg)}
.tlrow.co .tlbody::before{background:var(--orange)}
.tltitle{font-size:11px;font-weight:600;color:var(--text)}
.tldesc{font-family:var(--mono);font-size:9px;color:var(--text2);margin-top:2px;line-height:1.5}
.wdays{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.wbtn{padding:6px 12px;border-radius:4px;font-family:var(--mono);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text3);transition:all .12s}
.wbtn:hover{border-color:rgba(200,168,75,.4);color:var(--text)}
.wbtn.on{background:var(--gold);color:#080808;border-color:var(--gold);font-weight:700}
.pc{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:14px;transition:border-color .15s;margin-bottom:12px;cursor:pointer}
.pc:hover{border-color:rgba(200,168,75,.3)}
.pcn{font-size:13px;font-weight:700;margin-bottom:3px}
.pcd{font-family:var(--mono);font-size:9px;color:var(--text2);margin-bottom:10px;line-height:1.5}
.pcbar{height:2px;background:var(--border2);border-radius:1px;margin-bottom:6px;overflow:hidden}
.pcfill{height:100%;border-radius:1px;background:var(--gold)}
.pcmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--text3)}
.ftime{font-family:var(--mono);font-size:8px;color:var(--gold);margin:12px 0 7px;letter-spacing:2px;text-transform:uppercase}
.fi{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(30,30,30,.7)}
.fi:last-child{border-bottom:none}
.fn{font-size:11px}
.fm{font-family:var(--mono);font-size:9px;color:var(--text2)}
input,textarea,select{background:var(--surface);border:1px solid var(--border2);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:11px;padding:8px 10px;outline:none;transition:border-color .15s;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
input::placeholder,textarea::placeholder{color:var(--text3)}
textarea{font-family:var(--body);font-size:12px;resize:vertical}
.btn{padding:8px 16px;border-radius:4px;font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border:none;transition:all .15s}
.btg{background:var(--gold);color:#080808;font-weight:700}
.btg:hover{background:var(--gold2)}
.bto{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.bto:hover{border-color:var(--gold);color:var(--gold)}
.btd{background:transparent;border:1px solid rgba(232,64,64,.3);color:var(--red)}
.btd:hover{background:var(--red-bg)}
.divider{height:1px;background:var(--border);margin:14px 0}
.jj-slot{padding:6px 10px;border-radius:4px;margin-bottom:5px;border-left:3px solid}
.jj-av{border-color:var(--gold);background:var(--gold-bg)}
.jj-az{border-color:var(--blue);background:var(--blue-bg)}
.jj-tl{border-color:var(--green);background:var(--green-bg)}
.jj-nogi{border-color:var(--red);background:var(--red-bg)}
.jj-free{border-color:var(--text3);background:rgba(85,85,85,.1)}
.jj-time{font-family:var(--mono);font-size:9px;font-weight:700}
.jj-name{font-size:11px;font-weight:600;margin-top:2px}
.jj-note{font-family:var(--mono);font-size:8px;color:var(--text2);margin-top:2px}
.exam-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px;text-align:center}
.exam-card .exam-n{font-family:var(--display);font-size:18px;letter-spacing:2px;color:var(--gold)}
.exam-card .exam-d{font-family:var(--mono);font-size:9px;color:var(--text3);margin:4px 0}
.exam-card .exam-days{font-family:var(--display);font-size:36px;letter-spacing:1px}
.exam-card .exam-c{font-family:var(--mono);font-size:8px;color:var(--text3);margin-top:4px;line-height:1.6}
.exam-urgent{color:var(--red)!important}
.exam-warn{color:var(--orange)!important}
.exam-ok{color:var(--green)!important}
.step-i{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.step-i:last-child{border-bottom:none}
.step-num{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--gold);flex-shrink:0;transition:all .15s}
.step-i.done .step-num{background:var(--gold);color:#080808;border-color:var(--gold)}
.step-body{flex:1}
.step-t{font-size:12px;font-weight:600}
.step-d{font-family:var(--mono);font-size:9px;color:var(--text2);margin-top:2px;line-height:1.5}
.step-i.done .step-t{text-decoration:line-through;color:var(--text3)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:center;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:24px;width:90%;max-width:520px;max-height:80vh;overflow-y:auto}
.modal .ptitle{font-size:24px;margin-bottom:12px}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.pri-h{color:var(--red)}.pri-m{color:var(--orange)}.pri-l{color:var(--green)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin:12px 0}
.cal-hd{font-family:var(--mono);font-size:8px;color:var(--text3);text-align:center;padding:6px 2px;letter-spacing:1px}
.cal-day{background:var(--surface);border:1px solid var(--border);border-radius:3px;min-height:60px;padding:4px;font-family:var(--mono);font-size:8px;color:var(--text3);cursor:pointer;transition:border-color .15s}
.cal-day:hover{border-color:var(--gold-border)}
.cal-day.today{border-color:var(--gold);background:var(--gold-bg)}
.cal-day.has-ev{border-left:2px solid var(--gold)}
.cal-dn{font-weight:700;margin-bottom:2px}
.cal-ev{font-size:7px;color:var(--gold);line-height:1.4;overflow:hidden;max-height:40px}
.detail-back{font-family:var(--mono);font-size:9px;color:var(--gold);cursor:pointer;margin-bottom:14px;display:inline-block;letter-spacing:1px}
.detail-back:hover{text-decoration:underline}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">DME LIFE OS</div>
  <div class="hdr-date" id="hDate"></div>
  <div class="hdr-right"><div class="pulse"></div><span id="hStreak">&mdash;</span></div>
</header>

<nav class="nav" id="mainNav"></nav>

<div class="wrap" id="mainWrap"></div>

<!-- CHECK-IN MODAL -->
<div class="modal-bg" id="checkinModal">
  <div class="modal">
    <div class="ptitle">Check-in</div>
    <div class="psub">30 SEGUNDOS — SÓ O QUE IMPORTA</div>
    <div style="display:grid;gap:10px">
      <div><label style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px">SONO (horas)</label><input type="number" id="ci-sleep" min="0" max="14" step="0.5" placeholder="7"></div>
      <div><label style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px">COMO ACORDOU?</label>
        <select id="ci-mood"><option value="pronto">Pronto pra guerra</option><option value="ok">Bem, normal</option><option value="cansado">Cansado</option><option value="mal">Mal, péssimo</option></select>
      </div>
      <div><label style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px">ORAÇÃO FEITA?</label>
        <select id="ci-oracao"><option value="sim">Sim</option><option value="nao">Ainda não</option></select>
      </div>
      <div><label style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px">FOCO DO DIA (automático)</label><input type="text" id="ci-project" disabled style="opacity:.7;cursor:not-allowed"></div>
      <div><label style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px">PESO (kg, opcional)</label><input type="number" id="ci-weight" min="40" max="200" step="0.1" placeholder=""></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btg" onclick="saveCheckin()">Registrar</button>
        <button class="btn bto" onclick="closeCheckin()">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<!-- MEMORY MODAL -->
<div class="modal-bg" id="memoryModal">
  <div class="modal">
    <div class="ptitle">Nova Memória</div>
    <div class="psub">REGISTRAR INSIGHT, DECISÃO, LIÇÃO</div>
    <div style="display:grid;gap:10px">
      <div><label style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px">TIPO</label>
        <select id="mem-type"><option value="insight">Insight</option><option value="decision">Decisão</option><option value="lesson">Lição</option><option value="health">Saúde</option><option value="project">Projeto</option><option value="personal">Pessoal</option></select>
      </div>
      <div><label style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px">TÍTULO</label><input type="text" id="mem-title" placeholder="Título da memória"></div>
      <div><label style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px">CONTEÚDO</label><textarea id="mem-content" rows="4" placeholder="Descreva..."></textarea></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btg" onclick="saveMemory()">Salvar</button>
        <button class="btn bto" onclick="closeMemory()">Cancelar</button>
      </div>
    </div>
  </div>
</div>

<!-- TASK MODAL -->
<div class="modal-bg" id="taskModal">
  <div class="modal">
    <div class="ptitle">Nova Task</div>
    <div style="display:grid;gap:10px">
      <div><label style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px">TÍTULO</label><input type="text" id="task-title" placeholder="O que precisa ser feito?"></div>
      <div><label style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px">PROJETO</label>
        <select id="task-proj"><option value="">Geral</option><option value="payments">Payments Line</option><option value="rowcapital">Row Capital</option><option value="sde">SDE Distribuidora</option><option value="resumed">Resumed</option><option value="athena">AthenaLabs</option><option value="copilottt">CO-PILOTTT</option><option value="lawhouse">LAW HOUSE</option><option value="barberfy">Barber.fy</option><option value="ufrj">UFRJ</option><option value="lcastilho">L Castilho Imóveis</option><option value="tennisfy">Tennis.fy</option><option value="pubfy">Pub.fy</option><option value="sophia">SOPH.IA</option></select>
      </div>
      <div><label style="font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:1px">PRIORIDADE</label>

const LS_KEY = 'dmeLifeOS_v6';

function loadState() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; }
}
function saveState() { localStorage.setItem(LS_KEY, JSON.stringify(S)); }

// ── MIGRATE from old dme_v4 ──
function migrateOldData() {
  try {
    const old = JSON.parse(localStorage.getItem('dme_v4'));
    if (!old) return null;
    const migrated = {};
    if (old.checks && Object.keys(old.checks).length > 0) migrated._oldChecks = old.checks;
    if (old.water) migrated.water = { [new Date().toISOString().slice(0,10)]: old.water };
    if (old.scores && Object.keys(old.scores).length > 0) migrated._oldScores = old.scores;
    if (old.notes) migrated.memories = [{type:'personal',title:'Notas migradas do app antigo',content:old.notes,date:new Date().toISOString().slice(0,10)}];
    if (old.weights && old.weights.length > 0) migrated._oldWeights = old.weights;
    if (old.trW) migrated._trWeek = old.trW;
    if (old.jjW) migrated._jjWeek = old.jjW;
    if (old.ew && old.ew.length > 0) {
      if (!migrated.tasks) migrated.tasks = [];
      old.ew.forEach(function(ev) { migrated.tasks.push({title: ev.l + ' (todo ' + ev.d + ' ' + ev.h + ')', proj:'', pri:'medium', due:'', done:false, created:new Date().toISOString().slice(0,10)}); });
    }
    if (old.em && old.em.length > 0) {
      if (!migrated.tasks) migrated.tasks = [];
      old.em.forEach(function(ev) { migrated.tasks.push({title: ev.l + ' (dia ' + ev.d + ' de cada mês)', proj:'', pri:'medium', due:'', done:false, created:new Date().toISOString().slice(0,10)}); });
    }
    if (old.provas && old.provas.length > 0) {
      if (!migrated.tasks) migrated.tasks = [];
      old.provas.forEach(function(pv) { migrated.tasks.push({title: 'PROVA: ' + pv.m + (pv.l ? ' - ' + pv.l : ''), proj:'ufrj', pri:'high', due:pv.dt, done:false, created:new Date().toISOString().slice(0,10)}); });
    }
    if (old.fx && Object.keys(old.fx).length > 0) migrated._oldFx = old.fx;
    return migrated;
  } catch(e) { return null; }
}

let S = loadState();
if (Object.keys(S).length === 0) {
  const migrated = migrateOldData();
  if (migrated) { S = migrated; localStorage.setItem(LS_KEY, JSON.stringify(S)); }

if (!S.memories) S.memories = [];

var DOW = new Date().getDay();

function getFastingState() {
  var now = new Date();
  var h = now.getHours();
  var m = now.getMinutes();
  var s = now.getSeconds();
  var isFasting = (h >= FAST_START || h < FAST_END);
  var nextChange, label, elapsed, total;
  if (isFasting) {
    label = 'JEJUM';
    total = FAST_HOURS * 3600;
    if (h >= FAST_START) {
      elapsed = (h - FAST_START) * 3600 + m * 60 + s;
      nextChange = new Date(now);
      nextChange.setDate(nextChange.getDate() + 1);
      nextChange.setHours(FAST_END, 0, 0, 0);
    } else {
      elapsed = (24 - FAST_START + h) * 3600 + m * 60 + s;
      nextChange = new Date(now);
      nextChange.setHours(FAST_END, 0, 0, 0);
    }
  } else {
    label = 'JANELA ALIMENTAR';
    total = (FAST_START - FAST_END) * 3600;
    elapsed = (h - FAST_END) * 3600 + m * 60 + s;
    nextChange = new Date(now);
    nextChange.setHours(FAST_START, 0, 0, 0);
  }
  var remaining = Math.max(0, Math.floor((nextChange - now) / 1000));
  var pct = Math.min(100, Math.round((elapsed / total) * 100));
  return {isFasting: isFasting, label: label, remaining: remaining, pct: pct, elapsed: elapsed, total: total};
}

function fmtCountdown(sec) {
  var hh = Math.floor(sec / 3600);
  var mm = Math.floor((sec % 3600) / 60);
  var ss = sec % 60;
  return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
}

function getFastingStreak() {
  if (!S.fastingDone) return 0;
  var streak = 0;
  var d = new Date(TODAY);
  d.setDate(d.getDate() - 1);
  while (true) {
    var dk = d.toISOString().slice(0, 10);
    if (S.fastingDone[dk]) { streak++; d.setDate(d.getDate() - 1); }
    else break;
  }
  if (S.fastingDone[TODAY]) streak++;
  return streak;
}

// Helper: get current study week
function getCurrentStudyWeek() {
  var today = new Date();
  for (var i = 0; i < STUDY_PLAN.length; i++) {
    var ws = new Date(STUDY_PLAN[i].start);
    var we = new Date(STUDY_PLAN[i].end);
    we.setHours(23,59,59);
    if (today >= ws && today <= we) return i;
  }
  return -1;
}

// ── DEEP WORK: what exactly to do per day ──
function getDeepWorkInfo(dow) {
  var cwi = getCurrentStudyWeek();
  if (cwi < 0) return {study:null, proj:DAILY_FOCUS[dow].proj, projDesc:DAILY_FOCUS[dow].desc};
  var cw = STUDY_PLAN[cwi];
  var info = {proj:DAILY_FOCUS[dow].proj, projDesc:DAILY_FOCUS[dow].desc};

  // Terça (2) e Quinta (4): aulas de Calc Num + Calc 3 + Mec I
  // Deep Work 15h-16:30 = revisar o que viu em aula + exercícios
  // Noite 20:30 = exercícios do plano semanal
  if (dow === 2) {
    info.study = 'Revisar aula de hoje: resolver exercícios de Cálc. Numérico + Cálculo 3 + Mecânica I';
    info.studyDetail = 'C3: ' + cw.calc3.focus + ' | M1: ' + cw.mec1.focus;
    info.noite = 'Exercícios do plano: ' + cw.calc3.focus.split('—')[0].trim();
  }
  if (dow === 4) {
    info.study = 'Revisar aula de hoje: exercícios Cálc. Numérico + Cálculo 3 + Mecânica I';
    info.studyDetail = 'C3: ' + cw.calc3.focus + ' | M1: ' + cw.mec1.focus;
    info.noite = 'Exercícios do plano: ' + cw.mec1.focus.split('—')[0].trim();
  }

  // Quarta (3) e Sexta (5): aulas de Calc 4 + Fis 3
  // Deep Work = revisar Fis 3 e Calc 4 + projeto
  if (dow === 3) {
    info.study = 'Revisar aula de hoje: exercícios Cálculo 4 + Física 3';
    info.studyDetail = 'F3: ' + cw.fis3.focus;
    info.noite = null; // quarta não tem bloco noite de estudo
  }
  if (dow === 5) {
    info.study = 'Revisar aula de hoje: exercícios Cálculo 4 + Física 3';
    info.studyDetail = 'F3: ' + cw.fis3.focus;
    info.noite = null;
  }

  // Segunda (1): dia livre — usar manhã pra estudar, tarde pra projeto
  if (dow === 1) {
    info.study = 'Estudos livres: exercícios atrasados ou reforço da semana';
    info.studyDetail = 'Prioridade: ' + cw.calc3.focus + ' ou ' + cw.fis3.focus;
    info.noite = null;
  }

  // Sábado (6): sprint
  if (dow === 6) {
    info.study = 'Completar exercícios da semana + revisão espaçada';
    var reviews = [];
    if (cw.calc3.review) reviews.push('C3: ' + cw.calc3.review);
    if (cw.fis3.review) reviews.push('F3: ' + cw.fis3.review);
    if (cw.mec1 && cw.mec1.review) reviews.push('M1: ' + cw.mec1.review);
    info.studyDetail = reviews.length ? 'Revisões: ' + reviews.join(' | ') : 'Terminar listas pendentes';
    info.noite = null;
  }

  // Domingo (0): planejamento
  if (dow === 0) {
    info.study = 'Preparar materiais da semana + revisar plano de estudo';
    info.studyDetail = 'Semana ' + cw.week + ': ' + cw.label;
    info.noite = null;
  }

  return info;
}

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}


// Resolve DW_ placeholders in schedule descriptions
function resolveDW(desc, dow) {
  if (!desc || !desc.startsWith('DW_')) return desc;
  var info = getDeepWorkInfo(dow);
  switch(desc) {
    case 'DW_STUDY_1': return info.studyDetail || 'Exercícios livres — completar listas pendentes';
    case 'DW_PROJ_1': return 'Payments Line: API bancária, integrações, testes. 3h focado.';
    case 'DW_MIXED_2': return '45min estudo (revisar Calc3/MecI de hoje) + 45min Row Capital';
    case 'DW_NOITE_2': return info.noite || 'Resolver exercícios das listas da semana';
    case 'DW_STUDY_3': return '1h30: ' + (info.studyDetail || 'Exercícios Cálculo 4 + Física 3');
    case 'DW_MIXED_4': return '45min estudo (revisar Calc3/MecI de hoje) + 45min Payments Line';
    case 'DW_NOITE_4': return info.noite || 'Resolver exercícios das listas da semana';
    case 'DW_MIXED_5': return '1h revisão Fis 3 + 1h30 Row Capital/Resumed';
    case 'DW_STUDY_6': return info.studyDetail || 'Completar exercícios da semana + revisões';
    case 'DW_STUDY_0': return info.studyDetail || 'Organizar materiais + revisar plano de estudo';
    default: return desc;
  }
}

// HEADER
function renderHeader() {
  var d = new Date();
  var days = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  var months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  document.getElementById('hDate').textContent = days[d.getDay()]+', '+d.getDate()+' de '+months[d.getMonth()]+' de '+d.getFullYear();
  var streak = 0;
  var check = new Date(d);
  check.setDate(check.getDate()-1);
  while(true) {
    var k = check.toISOString().slice(0,10);
    var h = S.habits[k];
    if (!h) break;
    var vals = Object.values(h);
    var done = vals.filter(function(v){return v==='done'}).length;
    if (done/Math.max(vals.length,1) >= 0.6) { streak++; check.setDate(check.getDate()-1); }
    else break;
  }
  document.getElementById('hStreak').textContent = streak+'d streak';
}

// ── HABITS PAGE ──
function renderHabits() {
  var page = document.getElementById('page-habits');
  var hToday = S.habits[TODAY] || {};
  var h = '<div class="ptitle">Hábitos</div><div class="psub">'+TODAY+' — CLICK = FEITO | DUPLO CLICK = PULAR</div>';
  var totalH = 0, doneH = 0;
  var cards = '';
  for (var group in HABITS) {
    var items = HABITS[group];
    cards += '<div class="card"><div class="clabel">'+group+'</div>';
    items.forEach(function(it) {
      totalH++;
      var st = hToday[it.id] || '';
      if (st==='done') doneH++;
      cards += '<div class="ci '+st+'" onclick="toggleHabit(\''+it.id+'\')" ondblclick="skipHabit(\''+it.id+'\')">';
      cards += '<div class="cbox"></div>';
      cards += '<div><div class="ctext">'+it.t+'</div><div class="csub">'+it.d+'</div></div>';
      cards += '</div>';
    });
    cards += '</div>';
  }
  var pct = totalH > 0 ? Math.round(doneH/totalH*100) : 0;
  h += '<div class="g2"><div>'+cards+'</div><div>';
  h += '<div class="card"><div class="clabel">Progresso Hoje</div>';
  h += '<div class="rw"><svg width="100" height="100" class="rsvg" viewBox="0 0 100 100"><circle class="rbg" cx="50" cy="50" r="40"/><circle class="rf" cx="50" cy="50" r="40" stroke="var(--gold)" stroke-dasharray="251" stroke-dashoffset="'+(251-251*pct/100)+'"/><text x="50" y="47" class="rl" style="font-size:18px" transform="rotate(90,50,50)">'+pct+'%</text><text x="50" y="60" class="rs" transform="rotate(90,50,50)">COMPLETO</text></svg></div>';
  h += '<div class="sr"><div class="srl">Feitos</div><div class="srr">'+doneH+' / '+totalH+'</div></div>';
  h += '</div>';
  // 7-day history
  h += '<div class="card"><div class="clabel">Últimos 7 dias</div>';
  for (var i=6;i>=0;i--) {
    var dd = new Date(); dd.setDate(dd.getDate()-i);
    var dk = dd.toISOString().slice(0,10);
    var dh = S.habits[dk] || {};
    var dvals = Object.values(dh);
    var ddone = dvals.filter(function(v){return v==='done'}).length;
    var dpct = dvals.length > 0 ? Math.round(ddone/dvals.length*100) : 0;
    var dayL = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][dd.getDay()];
    h += '<div class="sr"><div class="srl">'+dayL+' '+dk.slice(5)+'</div><div class="srr">'+dpct+'%</div></div>';
  }
  h += '</div>';
  h += '</div></div>';
  page.innerHTML = h;
}

  var page = document.getElementById('page-ufrj');

    h += '</div>';
    // Cálculo 3 this week
    h += '<div class="card" style="border-left:3px solid var(--gold);margin-bottom:10px">';
    h += '<div class="clabel" style="color:var(--gold)">CÁLCULO 3 — '+cw.calc3.focus+'</div>';
    cw.calc3.tasks.forEach(function(t) {
      var key = 'sp_c3_w'+cw.week+'_'+t.substring(0,20).replace(/[^a-zA-Z0-9]/g,'');
      var done = S.studyDone && S.studyDone[key];
      h += '<div class="ci '+(done?'done':'')+'" onclick="toggleStudyTask(\''+key+'\')"><div class="cbox"></div><div class="ctext" style="font-size:11px">'+t+'</div></div>';
    });
    if (cw.calc3.review) h += '<div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:6px">REVISÃO ESPAÇADA: '+cw.calc3.review+'</div>';
    h += '</div>';
    // Física 3 this week
    h += '<div class="card" style="border-left:3px solid var(--blue);margin-bottom:10px">';
    h += '<div class="clabel" style="color:var(--blue)">FÍSICA 3 — '+cw.fis3.focus+'</div>';
    cw.fis3.tasks.forEach(function(t) {
      var key = 'sp_f3_w'+cw.week+'_'+t.substring(0,20).replace(/[^a-zA-Z0-9]/g,'');
      var done = S.studyDone && S.studyDone[key];
      h += '<div class="ci '+(done?'done':'')+'" onclick="toggleStudyTask(\''+key+'\')"><div class="cbox"></div><div class="ctext" style="font-size:11px">'+t+'</div></div>';
    });
    if (cw.fis3.review) h += '<div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:6px">REVISÃO ESPAÇADA: '+cw.fis3.review+'</div>';
    h += '</div>';
    // Mecânica I this week
    if (cw.mec1) {
    h += '<div class="card" style="border-left:3px solid var(--red);margin-bottom:10px">';
    h += '<div class="clabel" style="color:var(--red)">MECÂNICA I — '+cw.mec1.focus+'</div>';
    cw.mec1.tasks.forEach(function(t) {
      var key = 'sp_m1_w'+cw.week+'_'+t.substring(0,20).replace(/[^a-zA-Z0-9]/g,'');
      var done = S.studyDone && S.studyDone[key];
      h += '<div class="ci '+(done?'done':'')+'" onclick="toggleStudyTask(\''+key+'\')"><div class="cbox"></div><div class="ctext" style="font-size:11px">'+t+'</div></div>';
    });

    h += '</div>';
    }
    // Progress bar
    var totalTasks = cw.calc3.tasks.length + cw.fis3.tasks.length + (cw.mec1?cw.mec1.tasks.length:0);

    cw.fis3.tasks.forEach(function(t) { var k='sp_f3_w'+cw.week+'_'+t.substring(0,20).replace(/[^a-zA-Z0-9]/g,''); if(S.studyDone&&S.studyDone[k])doneTasks++; });
    if(cw.mec1)cw.mec1.tasks.forEach(function(t) { var k='sp_m1_w'+cw.week+'_'+t.substring(0,20).replace(/[^a-zA-Z0-9]/g,''); if(S.studyDone&&S.studyDone[k])doneTasks++; });

    h += '<div style="background:var(--border);height:6px;border-radius:3px"><div style="background:'+pc+';height:100%;width:'+pct+'%;border-radius:3px;transition:width 0.3s"></div></div>';

    var phaseColors = {'PRÉ-P1':'var(--green)','P1':'var(--red)','PRÉ-P2':'var(--gold)','P2':'var(--red)','PRÉ-P3':'var(--orange)','P3':'var(--red)'};
    h += '<div style="font-family:var(--display);font-size:16px;color:'+phaseColors[phase]+';letter-spacing:2px;margin:14px 0 8px">'+phase+'</div>';
    weeks.forEach(function(w) {
      var isCurrent = (cwi === STUDY_PLAN.indexOf(w));
      var bg = isCurrent ? 'background:var(--gold-bg);border:1px solid var(--gold)' : '';

      var total = w.calc3.tasks.length + w.fis3.tasks.length + (w.mec1?w.mec1.tasks.length:0);

      w.calc3.tasks.forEach(function(t){var k='sp_c3_w'+w.week+'_'+t.substring(0,20).replace(/[^a-zA-Z0-9]/g,'');if(S.studyDone&&S.studyDone[k])done++;});
      w.fis3.tasks.forEach(function(t){var k='sp_f3_w'+w.week+'_'+t.substring(0,20).replace(/[^a-zA-Z0-9]/g,'');if(S.studyDone&&S.studyDone[k])done++;});
      if(w.mec1)w.mec1.tasks.forEach(function(t){var k='sp_m1_w'+w.week+'_'+t.substring(0,20).replace(/[^a-zA-Z0-9]/g,'');if(S.studyDone&&S.studyDone[k])done++;});

      h += '<div class="card" style="'+bg+';margin-bottom:6px;padding:10px">';

  // Disciplines as clickable cards

    h += '</div>';
  });
  h += '</div>';
  page.innerHTML = h;
}


function toggleStudyTask(key) {
  if (!S.studyDone) S.studyDone = {};
  S.studyDone[key] = !S.studyDone[key];
  updateTodayScore();
  renderUFRJ();
  renderDashboard();
}

  ufrjDetailView = id;
  renderUFRJ();
}

  var page = document.getElementById('page-ufrj');

function renderAgenda() {

  h += '<button class="btn btg" onclick="openAgendaModal()">+ Novo Evento</button></div>';

  // Current month calendar
  var now = new Date();
  var year = now.getFullYear();
  var month = now.getMonth();
  var monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  h += '<div class="sep">'+monthNames[month]+' '+year+'</div>';
  h += '<div class="cal-grid">';
  ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].forEach(function(d) {
    h += '<div class="cal-hd">'+d+'</div>';
  });
  var firstDay = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month+1, 0).getDate();
  var startOffset = (firstDay === 0 ? 6 : firstDay - 1);
  for (var i=0; i<startOffset; i++) h += '<div class="cal-day" style="opacity:.3"></div>';
  for (var d=1; d<=daysInMonth; d++) {
    var dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var dayOfWeek = new Date(year, month, d).getDay();
    var evs = getEventsForDate(dateStr, dayOfWeek, d);
    var isToday = dateStr === TODAY;
    var hasEv = evs.length > 0;
    h += '<div class="cal-day'+(isToday?' today':'')+(hasEv?' has-ev':'')+'">';
    h += '<div class="cal-dn'+(isToday?' style="color:var(--gold)"':'')+'">'+d+'</div>';
    if (hasEv) {
      h += '<div class="cal-ev">';
      evs.slice(0,3).forEach(function(ev) { h += ev.title+'<br>'; });
      if (evs.length > 3) h += '+'+(evs.length-3)+' mais';
      h += '</div>';
    }
    h += '</div>';
  }
  h += '</div>';

  // Upcoming 30 days
  h += '<div class="sep">Próximos 30 Dias</div><div class="card">';
  var upcoming = [];
  for (var i=0; i<30; i++) {
    var futureDate = new Date(); futureDate.setDate(futureDate.getDate()+i);
    var fd = futureDate.toISOString().slice(0,10);
    var fdow = futureDate.getDay();
    var fdom = futureDate.getDate();
    var evs = getEventsForDate(fd, fdow, fdom);
    evs.forEach(function(ev) { upcoming.push({date:fd, ev:ev}); });
  }
  if (upcoming.length === 0) {
    h += '<div style="font-family:var(--mono);font-size:10px;color:var(--text3)">Nenhum evento nos próximos 30 dias</div>';
  }
  upcoming.forEach(function(u) {
    h += '<div class="sr"><div class="srl">'+u.date+'</div><div class="srr">'+u.ev.title+(u.ev.time?' | '+u.ev.time:'')+'</div></div>';
  });
  h += '</div>';

  // Recurring events
  h += '<div class="sep">Eventos Recorrentes Fixos</div>';
  h += '<div class="g2">';
  h += '<div class="card"><div class="clabel">Semanais</div>';
  FIXED_EVENTS.weekly.forEach(function(ev) {
    var dayN = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][ev.dow];
    h += '<div class="sr"><div class="srl">'+dayN+'</div><div class="srr">'+ev.title+'</div></div>';
  });
  h += '</div>';
  h += '<div class="card"><div class="clabel">Mensais</div>';
  FIXED_EVENTS.monthly.forEach(function(ev) {
    h += '<div class="sr"><div class="srl">Dia '+ev.dom+'</div><div class="srr">'+ev.title+'</div></div>';
  });
  h += '</div></div>';

  // Custom events
  if (S.events.length > 0) {
    h += '<div class="sep">Eventos Personalizados</div><div class="card">';
    S.events.forEach(function(ev, i) {
      var typeLabel = ev.type==='weekly'?'Semanal':ev.type==='monthly'?'Mensal':'Único';
      h += '<div class="sr"><div class="srl" style="flex:1">'+ev.title+' <span class="tag tg">'+typeLabel+'</span></div>';
      h += '<button class="btn btd" style="padding:2px 6px;font-size:7px" onclick="deleteEvent('+i+')">X</button></div>';
    });
    h += '</div>';
  }

  // Provas UFRJ
  h += '<div class="sep">Provas UFRJ</div><div class="card">';
  EXAMS.forEach(function(ex) {
    var diff = Math.ceil((new Date(ex.date)-new Date())/(1000*60*60*24));
    if (diff < 0) return;
    var cls = diff <= 14 ? 'color:var(--red)' : diff <= 30 ? 'color:var(--orange)' : 'color:var(--green)';
    h += '<div class="sr"><div class="srl">'+ex.n+'</div><div class="srr" style="'+cls+'">'+ex.date+' ('+diff+' dias)</div></div>';
  });
  h += '</div>';

  page.innerHTML = h;
}

function getEventsForDate(dateStr, dayOfWeek, dayOfMonth) {
  var events = [];
  // Fixed weekly
  FIXED_EVENTS.weekly.forEach(function(ev) {
    if (ev.dow === dayOfWeek) events.push(ev);
  });
  // Fixed monthly
  FIXED_EVENTS.monthly.forEach(function(ev) {
    if (ev.dom === dayOfMonth) events.push(ev);
  });
  // Exams
  EXAMS.forEach(function(ex) {
    if (ex.date === dateStr) events.push({title:'PROVA: '+ex.n, time:'', desc:ex.content.split('\n')[0]});
  });
  // Custom events
  S.events.forEach(function(ev) {
    if (ev.type === 'once' && ev.date === dateStr) events.push(ev);
    if (ev.type === 'weekly' && ev.dow == dayOfWeek) events.push(ev);
    if (ev.type === 'monthly' && ev.dom == dayOfMonth) events.push(ev);
  });
  return events;
}

// ── REVIEWS PAGE (AUTOMÁTICO) ──
// Gera revisões pré-definidas baseadas no STUDY_PLAN com revisão espaçada
function getSpacedReviews() {
  // Para cada semana do plano, gerar as revisões obrigatórias
  // Lógica de espaçamento: D+1 (revisão rápida), D+3 (reforço), D+7 (fixação), D+14 (teste)
  var reviews = [];
  var cwi = getCurrentStudyWeek();
  if (cwi < 0) return reviews;

  // Revisões que o plano da semana atual define explicitamente
  var cw = STUDY_PLAN[cwi];
  var subjects = [
    {key:'c3', data:cw.calc3, label:'Cálculo 3', color:'var(--gold)', tagCls:'tg'},
    {key:'f3', data:cw.fis3, label:'Física 3', color:'var(--blue)', tagCls:'tb'},
  ];
  if (cw.mec1) subjects.push({key:'m1', data:cw.mec1, label:'Mecânica I', color:'var(--red)', tagCls:'tr'});

  subjects.forEach(function(subj) {
    if (subj.data.review && subj.data.review !== null) {
      reviews.push({
        subj: subj.label,
        subjKey: subj.key,
        color: subj.color,
        tagCls: subj.tagCls,
        what: subj.data.review,
        type: 'semanal',
        typeLabel: 'REVISÃO DA SEMANA',
        week: cw.week,
        key: 'rev_'+subj.key+'_w'+cw.week+'_plan',
      });
    }
  });

  // Revisões espaçadas automáticas baseadas em semanas passadas
  // Para cada semana anterior, verificar se o conteúdo precisa de revisão espaçada
  var spacingDays = [
    {days: 3, label: 'REFORÇO (D+3)', type: 'reforco'},
    {days: 7, label: 'FIXAÇÃO (D+7)', type: 'fixacao'},
    {days: 14, label: 'CONSOLIDAÇÃO (D+14)', type: 'consolidacao'},
    {days: 28, label: 'TESTE FINAL (D+28)', type: 'teste'},
  ];

  for (var pw = 0; pw < cwi; pw++) {
    var prevWeek = STUDY_PLAN[pw];
    var weekEndDate = new Date(prevWeek.end);
    var today = new Date(TODAY);
    var daysSinceEnd = Math.floor((today - weekEndDate) / (1000*60*60*24));

    var prevSubjects = [
      {key:'c3', data:prevWeek.calc3, label:'Cálculo 3', color:'var(--gold)', tagCls:'tg'},
      {key:'f3', data:prevWeek.fis3, label:'Física 3', color:'var(--blue)', tagCls:'tb'},
    ];
    if (prevWeek.mec1) prevSubjects.push({key:'m1', data:prevWeek.mec1, label:'Mecânica I', color:'var(--red)', tagCls:'tr'});

    spacingDays.forEach(function(sp) {
      // Se estamos dentro da janela de revisão (+-3 dias)
      if (daysSinceEnd >= sp.days - 2 && daysSinceEnd <= sp.days + 3) {
        prevSubjects.forEach(function(subj) {
          // Não adicionar revisão de semanas de prova
          if (subj.data.focus.indexOf('PROVA') >= 0 || subj.data.focus.indexOf('P1') >= 0 || subj.data.focus.indexOf('P2') >= 0 || subj.data.focus.indexOf('P3') >= 0) return;
          if (subj.data.focus.indexOf('Sem prova') >= 0 || subj.data.focus.indexOf('encerrado') >= 0) return;

          reviews.push({
            subj: subj.label,
            subjKey: subj.key,
            color: subj.color,
            tagCls: subj.tagCls,
            what: subj.data.focus,
            type: sp.type,
            typeLabel: sp.label,
            week: prevWeek.week,
            weekLabel: prevWeek.label,
            key: 'rev_'+subj.key+'_w'+prevWeek.week+'_'+sp.type,
          });
        });
      }
    });
  }

  return reviews;
}

function renderReviews() {
  var page = document.getElementById('page-reviews');
  if (!S.reviewsDone) S.reviewsDone = {};

  var h = '<div class="ptitle">Revisões</div><div class="psub">REVISÃO ESPAÇADA AUTOMÁTICA — BASEADA NO PLANO</div>';
  h += '<div class="al al-g">As revisões são geradas automaticamente a partir do plano de estudo. Sistema de espaçamento: D+3 (reforço), D+7 (fixação), D+14 (consolidação), D+28 (teste final).</div>';

  var reviews = getSpacedReviews();

  // Separar por tipo: pendentes e feitas
  var pending = reviews.filter(function(r){ return !S.reviewsDone[r.key]; });
  var completed = reviews.filter(function(r){ return S.reviewsDone[r.key]; });

  // ── REVISÕES PENDENTES HOJE ──
  if (pending.length > 0) {
    // Agrupar por tipo
    var byType = {};
    pending.forEach(function(r) {
      if (!byType[r.typeLabel]) byType[r.typeLabel] = [];
      byType[r.typeLabel].push(r);
    });

    for (var typeName in byType) {
      h += '<div class="sep">' + typeName + '</div>';
      byType[typeName].forEach(function(r) {
        var rid = r.key.replace(/[^a-zA-Z0-9_]/g,'');
        h += '<div class="card" style="border-left:3px solid '+r.color+';margin-bottom:8px;padding:12px">';
        h += '<div style="display:flex;justify-content:space-between;align-items:center">';
        h += '<div>';
        h += '<span class="tag '+r.tagCls+'" style="margin-right:6px">'+r.subj+'</span>';
        if (r.weekLabel) h += '<span style="font-family:var(--mono);font-size:8px;color:var(--text3)">'+r.weekLabel+'</span>';
        h += '</div>';
        h += '<button class="btn btg" style="padding:4px 12px;font-size:9px" onclick="markReviewDone(\''+r.key+'\')">✓ Feito</button>';
        h += '</div>';
        h += '<div style="font-size:12px;margin-top:6px;color:var(--text)">'+r.what+'</div>';
        // Sugestão de como revisar
        h += '<div style="font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:6px">';
        if (r.type === 'semanal') h += 'Reler resumo + refazer 2 exercícios-chave';
        else if (r.type === 'reforco') h += 'Reler resumo de 1 página (15 min)';
        else if (r.type === 'fixacao') h += 'Refazer 3 exercícios sem olhar solução (30 min)';
        else if (r.type === 'consolidacao') h += 'Mini-simulado: 2 exercícios cronometrados (20 min)';
        else if (r.type === 'teste') h += 'Resolver 1 exercício de prova antiga do tema (15 min)';
        h += '</div>';
        h += '</div>';
      });
    }
  } else {
    h += '<div class="al al-gr" style="margin-top:14px">Nenhuma revisão pendente agora. Todas em dia!</div>';
  }

  // ── REVISÕES CONCLUÍDAS HOJE ──
  if (completed.length > 0) {
    h += '<div class="sep">Concluídas</div>';
    completed.forEach(function(r) {
      h += '<div class="card" style="border-left:3px solid var(--border2);margin-bottom:6px;padding:10px;opacity:0.5">';
      h += '<div style="display:flex;justify-content:space-between;align-items:center">';
      h += '<div><span class="tag '+r.tagCls+'" style="margin-right:6px">'+r.subj+'</span>';
      h += '<span style="font-size:11px;text-decoration:line-through;color:var(--text3)">'+r.what+'</span></div>';
      h += '<span style="font-family:var(--mono);font-size:9px;color:var(--green)">✓</span>';
      h += '</div></div>';
    });
  }

  // ── CALENDÁRIO DE REVISÕES (próximas 4 semanas) ──
  h += '<div class="sep">Próximas Revisões Programadas</div>';
  h += '<div class="card">';
  var futureReviews = [];
  for (var fw = 0; fw < STUDY_PLAN.length; fw++) {
    var fWeek = STUDY_PLAN[fw];
    var fSubjects = [
      {key:'c3', data:fWeek.calc3, label:'Cálculo 3', tagCls:'tg'},
      {key:'f3', data:fWeek.fis3, label:'Física 3', tagCls:'tb'},
    ];
    if (fWeek.mec1) fSubjects.push({key:'m1', data:fWeek.mec1, label:'Mecânica I', tagCls:'tr'});

    fSubjects.forEach(function(subj) {
      if (subj.data.review && subj.data.review !== null) {
        futureReviews.push({
          week: fWeek.week,
          label: fWeek.label,
          period: fWeek.start + ' → ' + fWeek.end,
          subj: subj.label,
          tagCls: subj.tagCls,
          what: subj.data.review,
          isCurrent: fw === getCurrentStudyWeek(),
        });
      }
    });
  }

  if (futureReviews.length === 0) {
    h += '<div style="font-family:var(--mono);font-size:10px;color:var(--text3)">Nenhuma revisão futura programada</div>';
  }
  futureReviews.forEach(function(fr) {
    var bg = fr.isCurrent ? 'background:var(--gold-bg);' : '';
    h += '<div class="sr" style="'+bg+';padding:6px 0;gap:8px">';
    h += '<div style="min-width:70px"><span style="font-family:var(--mono);font-size:9px;font-weight:'+(fr.isCurrent?'700':'400')+';color:'+(fr.isCurrent?'var(--gold)':'var(--text2)')+'">'+fr.label+'</span></div>';
    h += '<span class="tag '+fr.tagCls+'" style="flex-shrink:0">'+fr.subj+'</span>';
    h += '<div style="font-size:10px;color:var(--text2);flex:1">Revisar: '+fr.what+'</div>';
    h += '</div>';
  });
  h += '</div>';

  // ── DIÁRIO DE REFLEXÃO (manter funcionalidade de texto livre) ──
  var weekNum = getWeekNumber(new Date());
  var weekKey = 'w'+weekNum;

  h += '<textarea id="weekReview" rows="4" placeholder="O que avancei? O que falhou? Ajustes?">'+wr+'</textarea>';
  h += '<div style="margin-top:8px"><button class="btn btg" onclick="saveReview(\''+weekKey+'\',\'weekReview\')">Salvar</button></div></div>';

  page.innerHTML = h;

// ===================== DAILY SCORE SYSTEM =====================
// Calcula e salva o score do dia baseado em hábitos, estudo e checklist
function calcDailyScore(dateKey) {
  var score = {date: dateKey, habits: 0, habitsTotal: 0, study: 0, studyTotal: 0, checkin: false, water: 0, total: 0, max: 0, pct: 0};

  // 1) Hábitos (cada hábito feito = 1 ponto, max = total de hábitos)
  var hDay = S.habits[dateKey] || {};
  for (var group in HABITS) {
    HABITS[group].forEach(function(it) {
      score.habitsTotal++;
      if (hDay[it.id] === 'done') score.habits++;
    });
  }

  // 2) Estudo UFRJ (tarefas da semana, proporcional ao dia)
  var cwi = getCurrentStudyWeek();
  if (cwi >= 0) {
    var cw = STUDY_PLAN[cwi];
    var subjects = [{key:'c3', data:cw.calc3}, {key:'f3', data:cw.fis3}];
    if (cw.mec1) subjects.push({key:'m1', data:cw.mec1});
    subjects.forEach(function(subj) {
      subj.data.tasks.forEach(function(t) {
        score.studyTotal++;
        var k = 'sp_' + subj.key + '_w' + cw.week + '_' + t.substring(0,20).replace(/[^a-zA-Z0-9]/g,'');
        if (S.studyDone && S.studyDone[k]) score.study++;
      });
    });
  }

  // 3) Check-in feito (2 pontos)
  score.checkin = !!S.checkins[dateKey];

  // 4) Água (1 ponto se >= 2L, 2 pontos se >= 3L)
  score.water = S.water[dateKey] || 0;

  // 5) Revisões espaçadas feitas hoje
  score.reviews = 0;
  score.reviewsTotal = 0;
  if (S.reviewsDone) {
    var todayReviews = getSpacedReviews();
    score.reviewsTotal = todayReviews.length;
    todayReviews.forEach(function(r) {
      if (S.reviewsDone[r.key]) score.reviews++;
    });
  }

  // 6) Jejum cumprido
  score.fasting = (S.fastingDone && S.fastingDone[dateKey]) ? true : false;

  // Score total ponderado (100 pontos possíveis)
  var habitsPct = score.habitsTotal > 0 ? (score.habits / score.habitsTotal) : 0;
  var studyPct = score.studyTotal > 0 ? (score.study / score.studyTotal) : 0;
  var reviewPct = score.reviewsTotal > 0 ? (score.reviews / score.reviewsTotal) : 1; // se nao tem, nao penaliza
  var checkinPts = score.checkin ? 1 : 0;
  var waterPts = score.water >= 3 ? 1 : (score.water >= 2 ? 0.5 : 0);
  var fastingPts = score.fasting ? 1 : 0;

  // Pesos: Hábitos 25%, Estudo 25%, Revisões 15%, Jejum 15%, Check-in 10%, Água 10%
  score.pct = Math.round((habitsPct * 25) + (studyPct * 25) + (reviewPct * 15) + (fastingPts * 15) + (checkinPts * 10) + (waterPts * 10));
  score.total = score.pct;
  score.max = 100;

  return score;
}

function saveDailyScore(dateKey) {
  if (!S.dailyScores) S.dailyScores = {};
  S.dailyScores[dateKey] = calcDailyScore(dateKey);
  saveState();
}

  h += '<div style="font-family:var(--display);font-size:36px;color:var(--orange)">'+treinoStreak+'</div>';
  h += '<div style="font-family:var(--mono);font-size:9px;color:var(--text3)">dias seguidos</div></div>';

  // Streak de jejum IF
  var fastStreak = getFastingStreak();
  h += '<div class="card" style="text-align:center"><div style="font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--purple);text-transform:uppercase;margin-bottom:6px">Jejum IF</div>';
  h += '<div style="font-family:var(--display);font-size:36px;color:var(--purple)">'+fastStreak+'</div>';
  h += '<div style="font-family:var(--mono);font-size:9px;color:var(--text3)">dias seguidos</div></div>';
  h += '</div>';

  // ── PROVAS — CONTAGEM REGRESSIVA ──
  h += '<div class="sep">Próximas Provas</div><div class="g3">';
  EXAMS.forEach(function(ex) {
    var diff = Math.ceil((new Date(ex.date)-new Date())/(1000*60*60*24));
    if (diff < 0) return;
    var cls = diff <= 14 ? 'exam-urgent' : diff <= 30 ? 'exam-warn' : 'exam-ok';
    h += '<div class="exam-card"><div class="exam-n">'+ex.n+'</div><div class="exam-d">'+ex.date+'</div><div class="exam-days '+cls+'">'+diff+'d</div></div>';
  });
  h += '</div>';

  // ── HÁBITOS — MAPA DE CALOR (últimos 30 dias) ──
  h += '<div class="sep">Mapa de Calor — Hábitos (30 dias)</div>';
  h += '<div class="card" style="overflow-x:auto">';
  h += '<div style="display:grid;grid-template-columns:100px repeat(30, 1fr);gap:2px;font-family:var(--mono);font-size:7px">';
  // Header: dias
  h += '<div></div>';
  for (var d = 29; d >= 0; d--) {
    var dd = new Date(); dd.setDate(dd.getDate() - d);
    h += '<div style="text-align:center;color:'+(dd.toISOString().slice(0,10)===TODAY?'var(--gold)':'var(--text3)')+'">'+dd.getDate()+'</div>';
  }
  // Rows: cada hábito
  var allHabits = [];
  for (var group in HABITS) { HABITS[group].forEach(function(it){ allHabits.push(it); }); }
  allHabits.forEach(function(habit) {
    h += '<div style="color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:4px">'+habit.t.substring(0,14)+'</div>';
    for (var d = 29; d >= 0; d--) {
      var dd = new Date(); dd.setDate(dd.getDate() - d);
      var dk = dd.toISOString().slice(0,10);
      var st = (S.habits[dk] && S.habits[dk][habit.id]) || '';
      var bg = st === 'done' ? 'var(--green)' : st === 'skip' ? 'var(--border2)' : 'var(--border)';
      h += '<div style="background:'+bg+';border-radius:1px;height:12px;min-width:8px"></div>';
    }
  });
  h += '</div></div>';

  page.innerHTML = h;
}

// ===================== ROLLOVER SYSTEM =====================
// Verifica tarefas de estudo não concluídas de semanas anteriores
// e cria automaticamente itens pendentes para a semana atual.
function checkRollover() {
  if (!S.studyDone) S.studyDone = {};
  if (!S.rollover) S.rollover = {};

  var cwi = getCurrentStudyWeek();
  if (cwi <= 0) return; // sem semana anterior ou não estamos no período

  // Marca de controle: só roda 1x por semana
  var currentWeekKey = 'rollover_checked_w' + STUDY_PLAN[cwi].week;
  if (S.rollover[currentWeekKey]) return;

  // Verificar TODAS as semanas anteriores (não apenas a última)
  var pendingTasks = [];
  for (var pw = 0; pw < cwi; pw++) {
    var prevWeek = STUDY_PLAN[pw];
    var subjects = [
      {key:'c3', data: prevWeek.calc3, label:'Cálculo 3'},
      {key:'f3', data: prevWeek.fis3, label:'Física 3'},
    ];
    if (prevWeek.mec1) subjects.push({key:'m1', data: prevWeek.mec1, label:'Mecânica I'});

    subjects.forEach(function(subj) {
      subj.data.tasks.forEach(function(t) {
        var taskKey = 'sp_' + subj.key + '_w' + prevWeek.week + '_' + t.substring(0,20).replace(/[^a-zA-Z0-9]/g,'');
        if (!S.studyDone[taskKey]) {
          // Checar se já foi adicionada como rollover antes
          var rollKey = 'roll_' + taskKey;
          if (!S.rollover[rollKey]) {
            pendingTasks.push({
              title: '[PENDENTE — ' + prevWeek.label + '] ' + t,
              subj: subj.label,
              subjKey: subj.key,
              origWeek: prevWeek.week,
              origKey: taskKey,
              rollKey: rollKey
            });
          }
        }
      });
    });
  }

  // Criar tarefas na aba Tasks com tag ROLLOVER
  pendingTasks.forEach(function(pt) {
    // Verificar se a task já existe para não duplicar
    var alreadyExists = S.tasks.some(function(t) {
      return t.rollKey === pt.rollKey;
    });
    if (!alreadyExists) {
      S.tasks.push({
        title: pt.title,
        proj: 'ufrj',
        pri: 'high',
        due: STUDY_PLAN[cwi].end,
        done: false,
        created: TODAY,
        isRollover: true,
        rollKey: pt.rollKey,
        origKey: pt.origKey,
        subjKey: pt.subjKey,
      });
      S.rollover[pt.rollKey] = true;
    }
  });

  S.rollover[currentWeekKey] = true;
  saveState();
}

// Sobrescrever toggleTask para sincronizar rollover com studyDone
var _origToggleTask = typeof toggleTask === 'function' ? toggleTask : null;
function toggleTaskWithRollover(i) {
  var task = S.tasks[i];
  task.done = !task.done;
  // Se é rollover e foi marcada como feita, marcar no studyDone também
  if (task.isRollover && task.origKey && task.done) {
    if (!S.studyDone) S.studyDone = {};
    S.studyDone[task.origKey] = true;
  }
  // Se desmarcou, remover do studyDone
  if (task.isRollover && task.origKey && !task.done) {
    if (S.studyDone) S.studyDone[task.origKey] = false;
  }
  saveState();
  renderTasks();
}
// Substituir a função original
toggleTask = toggleTaskWithRollover;

}

init();
